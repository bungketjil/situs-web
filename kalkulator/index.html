<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kalkulator">
    <div class="riwayat" id="riwayat"></div>
    <div class="layar" id="layar">0</div>
    <div class="tombol-wadah" id="tombolWadah">
      <button data-aksi="hapus" class="abu">C</button>
      <button data-aksi="operator" data-nilai="÷" class="oranye">÷</button>
      <button data-aksi="operator" data-nilai="×" class="oranye">×</button>
      <button data-aksi="operator" data-nilai="-" class="oranye">-</button>

      <button data-aksi="angka" data-nilai="7">7</button>
      <button data-aksi="angka" data-nilai="8">8</button>
      <button data-aksi="angka" data-nilai="9">9</button>
      <button data-aksi="operator" data-nilai="+" class="oranye">+</button>

      <button data-aksi="angka" data-nilai="4">4</button>
      <button data-aksi="angka" data-nilai="5">5</button>
      <button data-aksi="angka" data-nilai="6">6</button>
      <button data-aksi="sama" class="oranye tinggi">=</button>

      <button data-aksi="angka" data-nilai="1">1</button>
      <button data-aksi="angka" data-nilai="2">2</button>
      <button data-aksi="angka" data-nilai="3">3</button>

      <button data-aksi="angka" data-nilai="0">0</button>
      <button data-aksi="titik">.</button>
      <button data-aksi="mundur" class="abu">⌫</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
